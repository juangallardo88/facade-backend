spring.application.name=medicore-backend
server.port=8080

# Datos por defecto para desarrollo local. Se usan H2 para que la app pueda arrancar sin PostgreSQL.
# Para producción o pruebas con PostgreSQL, se pueden sobrescribir con variables de entorno.
spring.datasource.url=${MEDICORE_DB_URL:jdbc:h2:mem:medicore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${MEDICORE_DB_USERNAME:sa}
spring.datasource.password=${MEDICORE_DB_PASSWORD:}
spring.datasource.driver-class-name=${MEDICORE_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${MEDICORE_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
